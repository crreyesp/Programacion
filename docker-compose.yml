services:
  postgres:
    image: postgres:15-alpine
    container_name: sigecol_postgres
    environment:
      POSTGRES_DB: sigecol
      POSTGRES_USER: sigecol_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sigecol_secure_2024}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sigecol_network
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigecol_backend
    environment:
      DATABASE_URL: postgresql://sigecol_user:${DB_PASSWORD:-sigecol_secure_2024}@postgres:5432/sigecol
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - sigecol_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigecol_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://37.27.198.175:8000
      NEXT_PUBLIC_APP_NAME: SIGECOL v4.16
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sigecol_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sigecol_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - sigecol_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sigecol_network:
    driver: bridge
